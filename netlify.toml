# Configuração de publicação no Netlify.
#
# O site é exportado como HTML estático (`output: "export"` no next.config.ts),
# então o Netlify não precisa de plugin nem de runtime do Next: ele só roda o
# build e serve a pasta `out/` a partir da CDN.
#
# Era isso que faltava quando a primeira publicação devolveu "Page not found".
# Sem `publish`, o Netlify serve a raiz do repositório, onde não existe
# index.html — o build até funcionava, mas ninguém apontava para o resultado.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  # Next.js 16 exige Node 20 ou superior. Sem fixar, o Netlify pode escolher
  # uma versão antiga e o build quebra por um motivo que não parece ter relação.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cabeçalhos de segurança.
#
# Num site exportado não existe servidor Next, então os cabeçalhos definidos em
# next.config.ts não são aplicados em produção. Aqui é a fonte da verdade.
#
# 'unsafe-eval' NÃO aparece nesta lista, ao contrário do que vale em
# desenvolvimento: eval() só é usado pelo Fast Refresh e não tem por que estar
# liberado no site publicado.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Os arquivos com hash no nome nunca mudam de conteúdo. Um ano de cache
# imutável evita que o visitante recorrente baixe de novo fonte e JavaScript.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Tipo das imagens de compartilhamento.
#
# As rotas de imagem do Next geram arquivos SEM extensão (`out/opengraph-image`),
# e o Netlify então os serve como `text/plain`. O `nosniff` acima, que existe
# por segurança, fecha a última saída: o leitor de link fica proibido de
# adivinhar que aquilo é um PNG, e o cartão do WhatsApp aparece sem figura.
#
# Estas regras declaram o tipo verdadeiro. Precisam acompanhar as rotas de
# imagem que existirem: hoje a da home e a de cada case.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/cases/:slug/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/servicos/:slug/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
